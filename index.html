<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Fruit Catcher - Pro Edition</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"
    crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="game-wrapper">
    <video id="input_video" autoplay playsinline></video>
    <div id="countdown"></div>

    <div class="stats">
      <span><img id="scoreIcon" class="icon-score" /> <span id="score">0</span></span>
      <span><img class="icon-timer" /> <span id="timer">60</span>s</span>
    </div>

    <div id="overlay">
      <img src="img/logo.png" alt="AR Fruit Catcher Logo" style="width:300px; margin-bottom:25px;">
      <img src="img/btn.png" alt="Start Mission" style="cursor:pointer; width:250px;" onclick="showBrandSelect()">
    </div>

    <div id="brandSelect">
      <h2>Select Your Brand</h2>
      <div class="brand-grid">
        <img src="img/logo/bb.png" alt="Bamboo Boy" class="brand-logo" onclick="selectBrand('bb')">
        <img src="img/logo/bm.png" alt="Broastmasters" class="brand-logo" onclick="selectBrand('bm')">
        <img src="img/logo/do.png" alt="Domino's" class="brand-logo" onclick="selectBrand('do')">
        <img src="img/logo/tb.png" alt="Taco Bell" class="brand-logo" onclick="selectBrand('tb')">
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script src="script.js"></script>
</body>

</html>
