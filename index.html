<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Fruit Catcher - Pro Edition</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"
    crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="game-wrapper">
    <div id="game-frame"></div>
    <div id="game-badge" hidden><img id="badgeLogo" alt="" /></div>

    <div id="game-inner">
      <video id="input_video" autoplay playsinline></video>
      <div id="countdown"></div>

      <div class="stats">
        <div class="stat-box stat-box--score">
          <img id="scoreIcon" class="stat-icon" alt="" />
          <span id="score">0</span>
          <label>Points</label>
        </div>
        <div class="stat-box stat-box--timer">
          <span id="timer">60</span>
          <label>Timer</label>
        </div>
      </div>

      <div id="overlay">
        <img src="img/logo.png" alt="AR Fruit Catcher Logo" style="width:300px; margin-bottom:25px;">
        <img src="img/btn.png" alt="Start Mission" style="cursor:pointer; width:250px;" onclick="showBrandSelect()">
      </div>

      <div id="brandSelect"></div>

      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
