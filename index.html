<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the Food - One Galle Face</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Luckiest+Guy&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"
    crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="game-wrapper">
    <div id="game-frame">
      <svg class="hill-svg" viewBox="0 0 868 1068" preserveAspectRatio="none">
        <path class="hill-fill" d="M0,0 L868,0 L868,70 Q795,110 723,70 Q650,30 578,70 Q505,110 433,70 Q360,30 288,70 Q215,110 143,70 Q70,30 0,70 Z"/>
        <path class="hill-fill" d="M0,1068 L868,1068 L868,998 Q795,958 723,998 Q650,1038 578,998 Q505,958 433,998 Q360,1038 288,998 Q215,958 143,998 Q70,1038 0,998 Z"/>
        <rect x="0" y="0" width="22" height="1068" class="hill-fill"/>
        <rect x="846" y="0" width="22" height="1068" class="hill-fill"/>
      </svg>
    </div>
    <div id="game-badge" hidden><img id="badgeLogo" alt="" /></div>

    <div id="game-inner">
      <video id="input_video" autoplay playsinline></video>
      <div id="countdown"></div>

      <div class="stats" id="statsHud" hidden>
        <div class="stat-medal stat-medal--score">
          <img id="scoreIcon" class="stat-icon" alt="" />
          <span id="score">0</span>
          <label>Points</label>
        </div>
        <div class="stat-medal stat-medal--timer">
          <img class="stat-icon stat-icon--timer" alt="" />
          <span id="timer">60</span>
          <label>Timer</label>
        </div>
      </div>

      <div id="overlay">
        <div class="location-badge"><img src="img/logo/ogf.png" alt="One Galle Face"></div>
        <img src="img/logo.png" alt="One Galle Face" class="logo">
        <div class="game-title-typed"><span class="title-word">Catch</span><span class="title-word">the</span><span class="title-word">Food</span></div>
        <img src="img/btn.png" alt="Start" class="start-btn" onclick="showBrandSelect()">
      </div>

      <div id="brandSelect"></div>

      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
