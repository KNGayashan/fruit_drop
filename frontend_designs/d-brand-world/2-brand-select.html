<!doctype html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body style="--p:#2f9e44; --s:#ffd43b; --sky-1:#7dd3fc; --sky-2:#e0f6ff;">
  <div id="wrap">
    <div id="frame">
      <div class="sky"></div>
      <div class="cloud" style="width:140px; height:44px; top:70px; left:6%;"></div>
      <div class="cloud" style="width:100px; height:34px; top:120px; left:60%;"></div>

      <svg class="hill-svg" viewBox="0 0 868 1068" preserveAspectRatio="none">

        <rect x="846" y="0" width="22" height="1068" fill="var(--p)"/>

      <div class="content">
        <div class="section-heading">Select Your Brand</div>
        <div class="section-sub">Each brand brings its own challenge</div>
        <div class="brand-grid">
          <div class="brand-card active"><img src="../../img/logo/bb.png"></div>

          <div class="brand-card"><img src="../../img/logo/do.png"></div>
          <div class="brand-card"><img src="../../img/logo/tb.png"></div>

      </div>
    </div>
