<!doctype html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body style="--p:#e0393e; --s:#2f9e44; --sky-1:#ffd8a8; --sky-2:#fff3d6;">
  <div id="wrap">
    <div id="frame">
      <div class="sky"></div>
      <div class="cloud" style="width:140px; height:44px; top:70px; left:6%;"></div>

      <svg class="hill-svg" viewBox="0 0 868 1068" preserveAspectRatio="none">
        <path fill="var(--p)" d="M0,0 L868,0 L868,70 Q795,110 723,70 Q650,30 578,70 Q505,110 433,70 Q360,30 288,70 Q215,110 143,70 Q70,30 0,70 Z"/>
        <path fill="var(--p)" d="M0,1068 L868,1068 L868,998 Q795,958 723,998 Q650,1038 578,998 Q505,958 433,998 Q360,1038 288,998 Q215,958 143,998 Q70,1038 0,998 Z"/>
        <rect x="0" y="0" width="22" height="1068" fill="var(--p)"/>
        <rect x="846" y="0" width="22" height="1068" fill="var(--p)"/>
      </svg>

      <div class="content">
        <img src="../../img/logo/bb.png" style="width:120px; margin-bottom:22px; background:#fff; border-radius:50%; padding:14px; box-shadow:0 8px 0 rgba(0,0,0,0.15);">
        <div class="section-heading" style="font-size:42px;">TIME'S UP!</div>
        <div class="score-card">
          <div class="lbl">Total Score</div>
          <div class="val">240</div>
        </div>
        <button class="btn-primary">↻ PLAY AGAIN</button>
      </div>
    </div>
  </div>
</body></html>
