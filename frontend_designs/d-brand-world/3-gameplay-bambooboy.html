<!doctype html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body style="--p:#e0393e; --s:#2f9e44; --sky-1:#ffd8a8; --sky-2:#fff3d6;">
  <div id="wrap">
    <div id="frame">
      <div class="sky"></div>
      <div class="cloud" style="width:120px; height:38px; top:130px; left:8%; opacity:0.8;"></div>

      <svg class="hill-svg" viewBox="0 0 868 1068" preserveAspectRatio="none">
        <path fill="var(--p)" d="M0,0 L868,0 L868,70 Q795,110 723,70 Q650,30 578,70 Q505,110 433,70 Q360,30 288,70 Q215,110 143,70 Q70,30 0,70 Z"/>
        <path fill="var(--p)" d="M0,1068 L868,1068 L868,998 Q795,958 723,998 Q650,1038 578,998 Q505,958 433,998 Q360,1038 288,998 Q215,958 143,998 Q70,1038 0,998 Z"/>
        <rect x="0" y="0" width="22" height="1068" fill="var(--p)"/>
        <rect x="846" y="0" width="22" height="1068" fill="var(--p)"/>
      </svg>

      <div class="scene">
        <span class="sparkle" style="top:180px; left:20%;">✨</span>
        <span class="sparkle" style="top:500px; left:82%;">✨</span>
        <span class="sparkle" style="top:700px; left:10%;">⭐</span>
        <img class="item" src="../../img/bb/1.png" style="top:150px; left:14%; width:64px;">
        <img class="item" src="../../img/apple.png" style="top:220px; left:74%;">
        <img class="item" src="../../img/bb/2.png" style="top:340px; left:60%; width:60px;">
        <img class="item" src="../../img/bomb.png" style="top:440px; left:18%; width:62px;">
        <img class="basket" src="../../img/basket.png">
        <div class="splat" style="top:380px; left:26%;">
          <svg viewBox="0 0 100 100"><path fill="var(--p)" d="M50 2 L61 24 L85 15 L74 38 L98 45 L75 55 L90 76 L65 68 L60 92 L48 72 L30 90 L28 65 L4 70 L18 48 L2 32 L26 30 L22 6 L45 22 Z"/></svg>
          <span style="position:relative;">-20</span>
        </div>
      </div>

      <div class="hud-top">
        <div class="stat-medal"><div class="val">240</div><div class="lbl">Points</div></div>
        <div class="stat-medal"><div class="val">32</div><div class="lbl">Timer</div></div>
      </div>
      <div class="badge-logo"><img src="../../img/logo/bb.png"></div>
    </div>
  </div>
</body></html>
